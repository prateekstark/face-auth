name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-opencv python3-numpy libpam-runtime

    - name: Install Python test requirements
      run: |
        python -m pip install --upgrade pip
        pip install numpy opencv-python

    - name: Run Unit Tests
      run: |
        python -m unittest discover tests/

    - name: Verify CLI Version & Help
      run: |
        python face_auth.py --version
        python face_auth.py --help
